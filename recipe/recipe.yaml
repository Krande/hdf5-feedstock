# recipe-lint fails if mpi is undefined
# prioritize nompi via build number
# add build string so packages can depend on
# mpi or nompi variants
# dependencies:
# `hdf5 * mpi_mvapich_*` for mvapich
# `hdf5 * mpi_mpich_*` for mpich
# `hdf5 * mpi_*` for any mpi
# `hdf5 * nompi_*` for no mpi
# mpi builds require the right mpi
# non-mpi builds *do not* appear to require non-mpi builds
# at least not always
schema_version: 1

context:
  version: 1.14.6
  maj_min_patch_ver: ${{ version | split(".") | join("_") }}
  maj_min_ver: ${{ (version | split("."))[0:2] | join("_") }}
  mpi: ${{ mpi or 'nompi' }}
  mpi_prefix: ${{ mpi }}
  hdf5_libs:
    - hdf5
    - hdf5_cpp
    - hdf5_hl
    - hdf5_hl_cpp

package:
  name: hdf5
  version: ${{ version }}

source:
  url: https://support.hdfgroup.org/releases/hdf5/v${{ maj_min_ver }}/v${{ maj_min_patch_ver }}/downloads/hdf5-${{ version }}.tar.gz
  sha256: e4defbac30f50d64e1556374aa49e574417c9e72c6b1de7a4ff88c4b1bea6e9b
  patches:
    # Atomicity tests seem to fail for openmpi
    # This seems to be a known bug
    # https://github.com/HDFGroup/hdf5/issues/2196
    - patches/0001-skip-testphdf5.patch
    # ref: http://hdf-forum.184993.n3.nabble.com/HDF5-1-8-14-15-16-with-OpenMPI-1-10-1-and-Intel-16-1-td4028533.html
    - if: mpi == 'openmpi'
      then: patches/0002-testpar_pflush.sh.in.openmpi.patch
    # h5diff help output test is flaky with mpi
    - if: mpi != 'nompi'
      then: patches/0003-testh5diff.sh.in.patch
    # Enable cross-compiling on osx
    - if: osx and build_platform != target_platform
      then: patches/0004-avoid-test-execution-when-cross-compiling.patch
    - if: osx and build_platform != target_platform
      then: patches/0005-run-host-H5detect-when-cross-compiling.patch
    - if: osx and mpi == 'mpich'
      then: patches/0006-skip-t_filters_parallel.patch

build:
  number: ${{ build }}
  string: ${{ mpi_prefix }}_h${{ hash }}_${{ build }}
  skip: not win

requirements:
  build:
    - if: unix
      then: gnuconfig
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('fortran') }}
    - cmake
    - if: not win
      then: automake
    - if: not win
      then: autoconf
    - if: not win
      then: libtool
    - if: not win
      then: make
    - if: win
      then: ninja
    - if: build_platform != target_platform and mpi != 'nompi' or build_platform != target_platform and mpi != 'nompi'
      then: mpi
    # Keep both versions of openssl in sync
    - openssl
    - if: linux
      then: diffutils
  host:
    - if: mpi != 'nompi' and mpi != 'impi' or mpi != 'nompi' and mpi != 'impi'
      then: mpi
    - if: mpi == 'impi'
      then: impi-devel
    - zlib
    - libaec
    - if: linux
      then: libacl
    - libcurl
    - openssl
  run_exports:
    - ${{ pin_subpackage('hdf5', upper_bound='x.x.x') }} ${{ build_pin }}
  ignore_run_exports:
    by_name:
      - libacl

tests:
  - files:
      recipe:
        - test
    requirements:
      run:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - if: not win
          then: ${{ compiler('fortran') }}
        - if: not win
          then: pkg-config
        - if: not win
          then: cmake
        - if: not win
          then: make
        - zlib
        - if: not win
          then: libgfortran5 >=13.3.0
    script:
      - if: not win
        then: command -v ${{ each_hdf5_unix_cmd }}
      - if: not win
        then: command -v ${{ each_hdf5_cmd }}
      - if: win
        then: where ${{ each_hdf5_cmd }}
      - if: not win
        then: test -f $PREFIX/lib/lib${{ each_hdf5_lib }}${SHLIB_EXT}
      - if: win
        then: if not exist %PREFIX%\\Library\\lib\\${{ each_hdf5_lib }}.lib exit 1
      - if: win
        then: if not exist %PREFIX%\\Library\\bin\\${{ each_hdf5_lib }}.dll exit 1
      - if: unix
        then: h5dump --filedriver=ros3 "http://s3.amazonaws.com/hdfgroup/data/hdf5demo/tall.h5" | grep '^HDF5'
      - if: win
        then: h5dump --filedriver=ros3 --s3-cred="(,,)" "https://s3.amazonaws.com/hdfgroup/data/hdf5demo/tall.h5" | findstr "^HDF5"

about:
  license: BSD-3-Clause
  license_file: COPYING
  summary: HDF5 is a data model, library, and file format for storing and managing data
  homepage: https://www.hdfgroup.org/solutions/hdf5/
  repository: https://github.com/HDFGroup/hdf5
  documentation: https://portal.hdfgroup.org/display/HDF5/HDF5

extra:
  recipe-maintainers:
    - hmaarrfk
    - jakirkham
